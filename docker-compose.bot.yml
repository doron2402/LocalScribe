services:
  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: .env.bot
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot-data:/data
      - ./secrets:/secrets:ro
    shm_size: 2gb     # Chromium crashes on Docker's 64 MB default
    ports:
      - "127.0.0.1:6080:6080"   # noVNC, only used by `login`

volumes:
  bot-data:
